{% extends "base.html" %}
{% block title %}Fantasy Books{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-white">Books in {{ subgenre }}</h1>
    <div class="card p-3 shadow-sm">
    <ul>
        {% for book_id, book in books %}
            <li class="list-group-item">
                <a href="{{ url_for('book_info', book_id=book_id) }}">
                     {{ book.booktitle }}
                </a>
            </li>
        {% endfor %}
    </ul>
    </div>
    <a href="{{ url_for('subgenres') }}" class="btn btn-primary">Back to List</a>
</div>
{% endblock %}
