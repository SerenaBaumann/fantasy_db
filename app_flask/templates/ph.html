{% extends "base.html" %}
{% block title %}Fantasy Books{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-white">List of Publishing Houses</h2>
    <ul class="list-group">
        {% for ph in the_phs %}
            <li class="list-group-item">
                <a href="{{url_for('pub_info', publishinghouse = ph )}}">
                    {{ ph }}
                </a>
            </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
